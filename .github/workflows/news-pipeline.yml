name: News Pipeline

on:
  schedule:
    - cron: '13,43 * * * *'    # every 30 min, offset avoids GitHub's :00/:30 congestion
  workflow_dispatch: {}         # manual "Run workflow" button

concurrency:
  group: news-pipeline
  cancel-in-progress: false     # slow run -> next one waits instead of overlapping

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # ---- A: fetch -> rewrite -> save (your existing 2.1-2.3 scripts) ----
      # keep whatever env names your pipeline.py already expects; these are the likely ones
      - name: Fetch -> rewrite -> save
        env:
          ZAI_API_KEY:          ${{ secrets.ZAI_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pipeline.py

      # ---- B: NEW — route each article to ONE platform + post with image ----
      - name: Route + post to socials
        env:
          ZAI_API_KEY:          ${{ secrets.ZAI_API_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}      # optional fallback
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}    # optional fallback
          LLM_MODEL:            glm-4.5-flash                    # plain env, not a secret
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL:     ${{ secrets.TELEGRAM_CHANNEL }}
          OWNER_CHAT_ID:        ${{ secrets.OWNER_CHAT_ID }}
          FACEBOOK_PAGE_ID:     ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN:  ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          SITE_URL:             ${{ secrets.SITE_URL }}
        run: python post.py

      # ---- C: DM yourself if anything above failed ----
      - name: Alert on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="⚠️ NewsShore pipeline failed: https://github.com/${GITHUB_REPOSITORY}/actions" \
            || true
