name: News Pipeline

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch: {}

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JS dependencies
        run: |
          if [ -f pipeline/package.json ]; then npm install --prefix pipeline
          elif [ -f package.json ]; then npm install
          else echo "No package.json found — tell the assistant"; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # ---- A: YOUR pipeline, untouched — fetch -> rewrite -> save ----
      - name: Fetch -> rewrite -> save
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GLM_API_KEY:          ${{ secrets.GLM_API_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID:        ${{ secrets.CF_ACCOUNT_ID }}
          NVIDIA_API_KEY:       ${{ secrets.NVIDIA_API_KEY }}
          UNSPLASH_ACCESS_KEY:  ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node pipeline/fetch-and-publish.js

      # ---- B: pick ONE platform per article + post with its image (no AI) ----
      - name: Route + post to socials
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL:     ${{ secrets.TELEGRAM_CHANNEL }}
          OWNER_CHAT_ID:        ${{ secrets.OWNER_CHAT_ID }}
          FACEBOOK_PAGE_ID:     ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN:  ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          SITE_URL:             ${{ secrets.SITE_URL }}
        run: python pipeline/post.py

      # ---- C: DM yourself if anything failed ----
      - name: Alert on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="⚠️ NewsShore pipeline failed: https://github.com/${GITHUB_REPOSITORY}/actions" \
            || true
