concurrency:
  group: fetch-publish
  cancel-in-progress: true
# This file goes at: .github/workflows/pipeline.yml (typing that full path
# when creating a new file on GitHub will auto-create both folders).
#
# It tells GitHub: "run the script inside the pipeline/ folder, on a schedule."

name: NewsShore Pipeline

on:
  schedule:
    - cron: '*/5 * * * *'      # at :00, :05, :10, :15...
    - cron: '2-59/5 * * * *'   # at :02, :07, :12, :17... — fills gaps when GitHub delays a run
  workflow_dispatch:            # keep this if present — manual trigger button

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline   # <-- runs everything from inside the pipeline/ folder
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run the pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: npm start
