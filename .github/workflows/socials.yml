name: Socials Pipeline

on:
  workflow_dispatch:   # lets cron-job.org trigger it
  schedule:
    - cron: '*/30 * * * *'   # keep as backup, or delete the schedule lines

concurrency:
  group: socials-pipeline
  cancel-in-progress: false

jobs:
  post-to-socials:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # ---- headless browser for the card snip (social image = website card) ----
      # Cache the ~170MB Chromium download. The key tracks requirements.txt so
      # a playwright version bump downloads its matching browser automatically.
      # If this step fails the run fails loudly (Telegram alert) rather than
      # silently posting card-less images — pending rows retry next run.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Route + post (reads Supabase only — no fetch, no AI)
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL:     ${{ secrets.TELEGRAM_CHANNEL }}
          OWNER_CHAT_ID:        ${{ secrets.OWNER_CHAT_ID }}
          WHAPI_TOKEN:          ${{ secrets.WHAPI_TOKEN }}
          WHATSAPP_CHANNEL_ID:  ${{ secrets.WHATSAPP_CHANNEL_ID }}
          FACEBOOK_PAGE_ID:     ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN:  ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          SITE_URL:             ${{ secrets.SITE_URL }}
          SNIP_ENABLED:         '1'
        run: python pipeline/post.py

      - name: Alert on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="⚠️ NewsShore socials pipeline failed: https://github.com/${GITHUB_REPOSITORY}/actions" \
            || true
