name: Update Leaderboard Data

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write # Needed to push updated JSON files

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: node scripts/update-leaderboards.js arena

      - run: node scripts/update-leaderboards.js agent

      - run: node scripts/update-leaderboards.js benchmarks

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: update leaderboard fallback data"
          git push
