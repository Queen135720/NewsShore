name: Update Leaderboards

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write # Needed to push updated JSON files

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Update chat arena leaderboard data
        run: node scripts/update-leaderboards.js arena

      - name: Update agent arena leaderboard data
        run: node scripts/update-leaderboards.js agent

      - name: Update benchmark leaderboard data
        run: node scripts/update-leaderboards.js benchmarks

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update leaderboard data [skip ci]"
          git pull --rebase origin main
          git push
